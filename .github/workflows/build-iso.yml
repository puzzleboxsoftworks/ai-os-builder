name: Build ISO

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Describe the OS (ignored when a spec is pasted below)
        required: false
        default: a headless rescue and networking toolkit with ssh
      spec:
        description: Spec JSON from the web app (optional)
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools

      - name: Write spec
        env:
          SPEC: ${{ inputs.spec }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -n "$SPEC" ]; then
            printf '%s' "$SPEC" > spec.json
          else
            python -m aios.cli plan "$PROMPT" --offline -o spec.json
          fi
          python -c "from aios.spec import OSSpec; s=OSSpec.load('spec.json'); print(s.to_json())"
          python -c "import json;print('slug='+json.load(open('spec.json'))['slug'])" >> "$GITHUB_ENV"

      - name: Build ISO
        run: python -m aios.cli build spec.json -o "dist/${{ env.slug }}.iso"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.slug }}-iso
          path: |
            dist/*.iso
            spec.json
          compression-level: 0
          retention-days: 7
